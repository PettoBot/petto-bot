name: Validate bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          forbidden='(^|/)(\.env($|\.)|\.claude\.env|\.discloud\.env|secrets|private)(/|$)|\.(pem|key|p12|pfx|jks|keystore|sqlite|sqlite3|db|dump)$'
          if git ls-files | grep -E "$forbidden"; then
            echo "Secret-like files must not be tracked."
            exit 1
          fi
      - name: Check JavaScript syntax
        run: npm run check
      - name: Check TypeScript and generated output
        run: |
          npm run types:check
          npm run build:ts
          git diff --exit-code -- src
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
