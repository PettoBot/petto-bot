[package]
name = "wordmatch"
version = "0.1.0"
edition = "2021"
description = "Finds any of thousands of words in a text at once (Aho-Corasick), for the moderation rules of Petto. Built to WebAssembly: see scripts/build-wasm.js."

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
strip = true
